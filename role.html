<!-- role.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Role</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial; text-align: center; padding-top: 100px; }
    button { padding: 12px 30px; font-size: 16px; margin: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>How would you like to use the site?</h2>
  <button id="seller-btn">I'm a Seller</button>
  <button id="buyer-btn">I'm a Buyer</button>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
      }
    });

    document.getElementById("seller-btn").addEventListener("click", () => {
      localStorage.setItem("userRole", "seller");
      window.location.href = "add-item.html";
    });

    document.getElementById("buyer-btn").addEventListener("click", () => {
      localStorage.setItem("userRole", "buyer");
      window.location.href = "main.html";
    });
  </script>
</body>
</html>
